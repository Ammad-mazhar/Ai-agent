[phases.setup]
# This single line handles almost all the dependencies you were trying to install manually
nixPkgs = ["nodejs", "google-chrome", "cacert"]

[phases.install]
cmds = ["npm install"]

[phases.build]
# We only install the specific browser binary for Puppeteer
cmds = ["PUPPETEER_CACHE_DIR=/root/.cache/puppeteer npx puppeteer browsers install chrome"]

[start]
cmd = "node index.js"